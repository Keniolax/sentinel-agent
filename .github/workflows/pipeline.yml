name: pipeline

# Every push and pull request runs the gate. Only a push to main builds the image and
# deploys, and only after the gate passes. The deploy jobs sign in to Azure as a managed
# identity with GitHub's OIDC token; the repository stores no Azure secret. The gate holds
# no Azure access at all.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  TERRAFORM_VERSION: "1.14.1"
  CHECKOV_VERSION: "3.3.30"
  SEMGREP_VERSION: "1.183.0"
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Unit tests
        run: |
          pip install --quiet --require-hashes -r requirements-dev.lock
          python -m pytest -q

      - name: Terraform format and validate
        run: |
          terraform fmt -check -recursive infra
          for stack in infra/bootstrap infra/main; do
            terraform -chdir=$stack init -backend=false -input=false
            terraform -chdir=$stack validate
          done

      - name: Checkov (hard fail), with the capstone's finance-grant policy
        run: |
          pip install --quiet "checkov==${CHECKOV_VERSION}"
          checkov -d infra --external-checks-dir policy/checkov/checks --compact --quiet
          # Prove the custom policy is load-bearing: on the fixtures it must fail the bad
          # finance grant and pass the good knowledge-container grant, exactly one each.
          got="$(checkov -d policy/checkov/fixture --external-checks-dir policy/checkov/checks \
            --check CKV_SENTINEL_1 -o json 2>/dev/null \
            | python3 -c 'import json,sys; o=json.load(sys.stdin); o=o[0] if isinstance(o,list) else o; r=o["results"]; print(len(r["failed_checks"]), len(r["passed_checks"]))')"
          test "$got" = "1 1" || { echo "policy fixtures gave [$got], expected [1 1]"; exit 1; }

      - name: Every scanner suppression carries a reason
        run: python3 scripts/check-skips.py infra

      - name: Trivy config and dependency scan (hard fail)
        run: |
          ./scripts/install-trivy.sh "$HOME/.local/bin"
          export PATH="$HOME/.local/bin:$PATH"
          trivy config infra --quiet --exit-code 1
          trivy fs . --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --quiet --exit-code 1

      - name: Semgrep (hard fail)
        run: |
          pip install --quiet "semgrep==${SEMGREP_VERSION}"
          semgrep scan --config p/python --config p/dockerfile --disable-nosem \
            --metrics off --error --timeout 30 app image scripts siem

      - name: Gitleaks over the whole history (hard fail)
        run: |
          cd "$RUNNER_TEMP"
          curl -sSfL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
          cd "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact --exit-code 1 .

  build:
    needs: gate
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write
    outputs:
      image: ${{ steps.push.outputs.image }}
    env:
      ACR: ${{ vars.ACR_NAME }}
      REPO: ${{ vars.ACR_LOGIN_SERVER }}/sentinel-agent
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tag from the image's inputs
        id: tag
        run: |
          # The tag hashes every file that goes into the image. A commit that changes only
          # Terraform or docs reuses the image already built, and tags never need overwriting.
          tag="src-$(git ls-files -s app image requirements.lock pyproject.toml | sha256sum | cut -c1-16)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "image tag $tag"
      - name: Azure sign-in as the deploy identity
        run: scripts/gha-azure-login.sh
      - name: Is this image already built?
        id: have
        run: |
          if az acr repository show --name "$ACR" --image "sentinel-agent:${{ steps.tag.outputs.tag }}" -o none 2>/dev/null; then
            echo "found=true" >> "$GITHUB_OUTPUT"; echo "already in the registry"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build the image
        if: steps.have.outputs.found == 'false'
        run: |
          docker build --platform linux/amd64 -f image/Dockerfile -t "$REPO:${{ steps.tag.outputs.tag }}" .
          docker image ls "$REPO:${{ steps.tag.outputs.tag }}"
          df -h / /mnt
      - name: Trivy image scan (hard fail on fixable high and critical)
        run: |
          # The image holds the model (about 1 GB). Trivy unpacks it to a temporary file,
          # which overflows the runner's root disk, so it works on /mnt instead. An image built
          # earlier is pulled from the registry and scanned again with today's database.
          sudo mkdir -p /mnt/trivy && sudo chown "$USER" /mnt/trivy
          export TMPDIR=/mnt/trivy
          ./scripts/install-trivy.sh "$HOME/.local/bin"
          az acr login --name "$ACR"
          src=docker; [ "${{ steps.have.outputs.found }}" = true ] && src=remote
          "$HOME/.local/bin/trivy" image --image-src "$src" --cache-dir /mnt/trivy/cache --severity HIGH,CRITICAL \
            --ignore-unfixed --exit-code 1 --ignorefile image/.trivyignore "$REPO:${{ steps.tag.outputs.tag }}"
      - name: Push, and resolve the digest
        id: push
        run: |
          if [ "${{ steps.have.outputs.found }}" = false ]; then
            docker push "$REPO:${{ steps.tag.outputs.tag }}"
          fi
          digest="$(az acr manifest show-metadata --registry "$ACR" --name "sentinel-agent:${{ steps.tag.outputs.tag }}" --query digest -o tsv)"
          echo "image=$REPO@$digest" >> "$GITHUB_OUTPUT"
          echo "deploying $REPO@$digest"

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - name: Azure sign-in as the deploy identity
        run: scripts/gha-azure-login.sh
      - name: Terraform apply
        env:
          # The azurerm provider and backend fetch their own OIDC token from GitHub.
          ARM_USE_OIDC: "true"
          ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          TF_VAR_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          TF_VAR_agent_image: ${{ needs.build.outputs.image }}
          TF_VAR_acr_id: ${{ vars.ACR_ID }}
          TF_VAR_lab_resource_group: ${{ vars.LAB_RESOURCE_GROUP }}
          TF_VAR_network_watcher_name: ${{ vars.NETWORK_WATCHER_NAME }}
        run: |
          terraform -chdir=infra/main init -input=false \
            -backend-config="resource_group_name=${{ vars.STATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ vars.STATE_STORAGE_ACCOUNT }}"
          terraform -chdir=infra/main apply -input=false -auto-approve
