# Overlay on home-soc-lab's compose.yaml for the capstone SIEM VM. The manager gets the
# capstone's start-up script, its rules, and read-only access to the collector's output.
services:
  wazuh.manager:
    volumes:
      - /opt/sentinel/sentinel-config.sh:/etc/cont-init.d/1-1-sentinel:ro
      - /opt/sentinel/local_rules.xml:/opt/sentinel/local_rules.xml:ro
      - /var/log/sentinel:/var/log/sentinel:ro
